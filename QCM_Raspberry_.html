<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#00d4aa;--secondary:#ff6b35;--accent:#7c3aed;--bg-dark:#0a0f1c;--bg-card:#111827;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#374151;--success:#10b981;--error:#ef4444;--warning:#f59e0b;--ch1:#f472b6;--ch2:#fb923c;--ch3:#a78bfa;--ch4:#fcd34d;--ch5:#34d399;--ch6:#60a5fa;--ch7:#f87171}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Outfit',sans-serif;background:var(--bg-dark);color:var(--text-primary);line-height:1.6}
        .bg-pattern{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(ellipse at 10% 10%,rgba(244,114,182,0.08) 0%,transparent 40%),radial-gradient(ellipse at 90% 80%,rgba(52,211,153,0.08) 0%,transparent 40%)}
        .header{background:linear-gradient(135deg,var(--bg-card) 0%,rgba(17,24,39,0.98) 100%);border-bottom:3px solid var(--primary);padding:40px 20px;text-align:center}
        .header h1{font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
        .header .subtitle{font-size:1.1rem;color:var(--text-secondary)}
        .badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}
        .badge{padding:8px 18px;border-radius:25px;font-size:0.85rem;font-weight:600}
        .badge.q{background:var(--accent);color:white}.badge.ch{background:var(--secondary);color:white}.badge.yr{background:var(--primary);color:var(--bg-dark)}
        .progress-section{position:sticky;top:0;z-index:100;background:rgba(10,15,28,0.95);backdrop-filter:blur(15px);padding:15px 20px;border-bottom:1px solid var(--border)}
        .progress-inner{max-width:1000px;margin:0 auto}
        .progress-stats{display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.9rem;color:var(--text-secondary)}
        .progress-stats span{color:var(--primary);font-weight:700;font-family:'JetBrains Mono',monospace}
        .progress-bar{height:10px;background:var(--border);border-radius:10px;overflow:hidden}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--ch1),var(--ch4),var(--primary));border-radius:10px;transition:width 0.4s;width:0%}
        .main{max-width:1000px;margin:0 auto;padding:30px 20px}
        .section-header{display:flex;align-items:center;gap:15px;margin:40px 0 20px;padding:20px;background:var(--bg-card);border-radius:16px;border-left:5px solid}
        .section-header.ch1{border-color:var(--ch1)}.section-header.ch2{border-color:var(--ch2)}.section-header.ch3{border-color:var(--ch3)}.section-header.ch4{border-color:var(--ch4)}.section-header.ch5{border-color:var(--ch5)}.section-header.ch6{border-color:var(--ch6)}.section-header.ch7{border-color:var(--ch7)}
        .section-icon{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:2rem}
        .section-header.ch1 .section-icon{background:rgba(244,114,182,0.15)}.section-header.ch2 .section-icon{background:rgba(251,146,60,0.15)}.section-header.ch3 .section-icon{background:rgba(167,139,250,0.15)}.section-header.ch4 .section-icon{background:rgba(252,211,77,0.15)}.section-header.ch5 .section-icon{background:rgba(52,211,153,0.15)}.section-header.ch6 .section-icon{background:rgba(96,165,250,0.15)}.section-header.ch7 .section-icon{background:rgba(248,113,113,0.15)}
        .section-info h2{font-size:1.4rem;font-weight:700}.section-info p{color:var(--text-secondary);font-size:0.9rem}
        .section-header.ch1 h2{color:var(--ch1)}.section-header.ch2 h2{color:var(--ch2)}.section-header.ch3 h2{color:var(--ch3)}.section-header.ch4 h2{color:var(--ch4)}.section-header.ch5 h2{color:var(--ch5)}.section-header.ch6 h2{color:var(--ch6)}.section-header.ch7 h2{color:var(--ch7)}
        .qcard{background:var(--bg-card);border-radius:14px;padding:22px;margin-bottom:15px;border:1px solid var(--border);position:relative}
        .qcard::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
        .qcard.ch1::before{background:var(--ch1)}.qcard.ch2::before{background:var(--ch2)}.qcard.ch3::before{background:var(--ch3)}.qcard.ch4::before{background:var(--ch4)}.qcard.ch5::before{background:var(--ch5)}.qcard.ch6::before{background:var(--ch6)}.qcard.ch7::before{background:var(--ch7)}
        .qcard.answered::after{content:'✓';position:absolute;top:12px;right:12px;width:26px;height:26px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:white;animation:pop 0.3s}
        @keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
        .qheader{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}
        .qnum{min-width:45px;height:45px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.95rem}
        .qcard.ch1 .qnum{background:rgba(244,114,182,0.15);color:var(--ch1)}.qcard.ch2 .qnum{background:rgba(251,146,60,0.15);color:var(--ch2)}.qcard.ch3 .qnum{background:rgba(167,139,250,0.15);color:var(--ch3)}.qcard.ch4 .qnum{background:rgba(252,211,77,0.15);color:var(--ch4)}.qcard.ch5 .qnum{background:rgba(52,211,153,0.15);color:var(--ch5)}.qcard.ch6 .qnum{background:rgba(96,165,250,0.15);color:var(--ch6)}.qcard.ch7 .qnum{background:rgba(248,113,113,0.15);color:var(--ch7)}
        .qtext{font-size:1.02rem;font-weight:500;flex:1;padding-top:8px;padding-right:35px}
        .qtext code{background:rgba(0,212,170,0.15);color:var(--primary);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.88rem}
        .opts{display:grid;gap:10px}
        .opt{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-dark);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.25s}
        .opt:hover{border-color:var(--primary);transform:translateX(3px)}
        .opt.selected{border-color:var(--primary);background:rgba(0,212,170,0.1)}
        .opt.selected .marker{background:var(--primary);color:var(--bg-dark)}
        .marker{min-width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.8rem;background:var(--border);color:var(--text-secondary);transition:all 0.25s}
        .otxt{flex:1;font-size:0.92rem}
        .otxt code{background:rgba(124,58,237,0.15);color:var(--accent);padding:2px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.85rem}
        .submit-section{text-align:center;padding:50px 20px;margin-top:30px}
        .submit-btn{padding:18px 60px;font-size:1.2rem;font-weight:700;font-family:'Outfit',sans-serif;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border:none;border-radius:16px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px}
        .submit-btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,212,170,0.3)}
        .submit-btn:disabled{background:var(--border);cursor:not-allowed;transform:none;box-shadow:none}
        .submit-warning{margin-top:15px;color:var(--warning);display:none}
        .results{display:none;margin-top:50px;padding:40px;background:var(--bg-card);border-radius:20px;border:3px solid var(--primary)}
        .results h2{text-align:center;font-size:2.2rem;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}
        .score-display{display:flex;justify-content:center;align-items:center;gap:30px;flex-wrap:wrap;margin:30px 0}
        .score-circle{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--primary) 0deg,var(--border) 0deg);display:flex;align-items:center;justify-content:center}
        .score-inner{width:130px;height:130px;border-radius:50%;background:var(--bg-card);display:flex;flex-direction:column;align-items:center;justify-content:center}
        .score-pct{font-size:2.8rem;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--primary)}
        .score-lbl{font-size:0.8rem;color:var(--text-secondary);text-transform:uppercase}
        .score-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
        .score-card{padding:20px;background:var(--bg-dark);border-radius:12px;text-align:center}
        .score-card .num{font-size:2.2rem;font-weight:800;font-family:'JetBrains Mono',monospace}
        .score-card.correct .num{color:var(--success)}.score-card.incorrect .num{color:var(--error)}.score-card.total .num{color:var(--accent)}
        .score-card .lbl{font-size:0.85rem;color:var(--text-secondary);margin-top:5px}
        .appreciation{text-align:center;padding:30px;margin-top:30px;background:linear-gradient(135deg,rgba(0,212,170,0.1),rgba(124,58,237,0.1));border-radius:16px}
        .appreciation h4{font-size:1.6rem;margin-bottom:8px}.appreciation p{color:var(--text-secondary)}
        .appreciation.excellent h4{color:var(--success)}.appreciation.good h4{color:var(--primary)}.appreciation.average h4{color:var(--warning)}.appreciation.poor h4{color:var(--error)}
        .answers-section{margin-top:40px}
        .answers-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
        .answers-header h3{font-size:1.5rem;color:var(--secondary)}
        .filter-btns{display:flex;gap:8px}
        .filter-btn{padding:6px 14px;border:2px solid var(--border);border-radius:18px;background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Outfit',sans-serif;font-size:0.8rem;transition:all 0.3s}
        .filter-btn:hover,.filter-btn.active{border-color:var(--primary);color:var(--primary)}
        .filter-btn.active{background:rgba(0,212,170,0.1)}
        .ans-card{background:var(--bg-dark);border-radius:10px;padding:15px;margin-bottom:10px;border-left:4px solid;display:flex;align-items:flex-start;gap:12px}
        .ans-card.correct{border-color:var(--success)}.ans-card.incorrect{border-color:var(--error)}
        .ans-card.hidden{display:none}
        .ans-status{min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
        .ans-status.correct{background:rgba(16,185,129,0.2);color:var(--success)}.ans-status.incorrect{background:rgba(239,68,68,0.2);color:var(--error)}
        .ans-content{flex:1}
        .ans-q{font-weight:600;margin-bottom:6px;font-size:0.9rem}
        .ans-info{display:flex;gap:12px;flex-wrap:wrap;font-size:0.8rem}
        .ans-info span{padding:3px 8px;border-radius:5px}
        .your-ans{background:rgba(148,163,184,0.1);color:var(--text-secondary)}.correct-ans{background:rgba(16,185,129,0.15);color:var(--success)}
        .footer{text-align:center;padding:30px;margin-top:40px;border-top:1px solid var(--border);color:var(--text-secondary)}
        .footer .author{color:var(--primary);font-weight:600}
        @media(max-width:768px){.header h1{font-size:2rem}.section-header{flex-direction:column;text-align:center}.qheader{flex-direction:column}.score-display{flex-direction:column}.score-cards{grid-template-columns:1fr}.submit-btn{padding:15px 40px;font-size:1rem}}
    </style>
</head>
<body>
<div class="bg-pattern"></div>
<header class="header">
    <h1>🍓 QCM Raspberry Pi Complet</h1>
    <p class="subtitle">Evaluation Complete - Architecture, Linux, GPIO & Serveurs</p>
    <div class="badges">
        <span class="badge q">📝 100 Questions</span>
        <span class="badge ch">📚 7 Chapitres</span>
    </div>
</header>
<div class="progress-section">
    <div class="progress-inner">
        <div class="progress-stats">
            <span>Progression : <span id="progressValue">0/100</span></span>
            <span>Complete : <span id="progressPercent">0%</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    </div>
</div>
<main class="main" id="questionsContainer"></main>
<div class="main">
    <div class="submit-section">
        <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">📝 Valider mes 100 Reponses</button>
        <p class="submit-warning" id="submitWarning">⚠️ Repondez a toutes les questions avant de valider</p>
    </div>
    <div class="results" id="results">
        <h2>📊 Resultats du QCM</h2>
        <div class="score-display">
            <div class="score-circle" id="scoreCircle">
                <div class="score-inner">
                    <span class="score-pct" id="scorePct">0%</span>
                    <span class="score-lbl">Score</span>
                </div>
            </div>
            <div class="score-cards">
                <div class="score-card correct"><div class="num" id="correctCount">0</div><div class="lbl">Correctes</div></div>
                <div class="score-card incorrect"><div class="num" id="incorrectCount">0</div><div class="lbl">Incorrectes</div></div>
                <div class="score-card total"><div class="num">100</div><div class="lbl">Total</div></div>
            </div>
        </div>
        <div class="appreciation" id="appreciation"><h4 id="appTitle"></h4><p id="appText"></p></div>
        <div class="answers-section">
            <div class="answers-header">
                <h3>📋 Correction Detaillee</h3>
                <div class="filter-btns">
                    <button class="filter-btn active" onclick="filterAnswers('all',this)">Toutes</button>
                    <button class="filter-btn" onclick="filterAnswers('correct',this)">Correctes</button>
                    <button class="filter-btn" onclick="filterAnswers('incorrect',this)">Incorrectes</button>
                </div>
            </div>
            <div id="answersContainer"></div>
        </div>
    </div>
</div>
<footer class="footer">
</footer>
<script>
const questions = [
// Chapter 1: Introduction (15 questions)
{q:1,ch:1,txt:"Qu'est-ce que le Raspberry Pi ?",opts:["Un microcontroleur programmable","Un nano-ordinateur monocarte","Un systeme d'exploitation Linux","Une carte d'extension pour PC"],ans:"b"},
{q:2,ch:1,txt:"En quelle annee a ete lance le premier Raspberry Pi ?",opts:["2008","2010","2012","2015"],ans:"c"},
{q:3,ch:1,txt:"Dans quel pays a ete creee la Fondation Raspberry Pi ?",opts:["Royaume-Uni","Etats-Unis","Allemagne","Japon"],ans:"a"},
{q:4,ch:1,txt:"Quel etait l'objectif initial du Raspberry Pi ?",opts:["Remplacer les PC de bureau","Creer des serveurs","Developper des jeux","Promouvoir l'enseignement informatique"],ans:"d"},
{q:5,ch:1,txt:"Environ combien d'unites de Raspberry Pi ont ete vendues ?",opts:["10 millions","Plus de 50 millions","5 millions","100 millions"],ans:"b"},
{q:6,ch:1,txt:"Quelle est la taille d'une carte Raspberry Pi standard ?",opts:["Taille d'un smartphone","Taille d'une cle USB","Taille d'une carte de credit","Taille d'une carte mere ATX"],ans:"c"},
{q:7,ch:1,txt:"En quelle annee a ete lance le Raspberry Pi 4 Model B ?",opts:["2019","2018","2020","2021"],ans:"a"},
{q:8,ch:1,txt:"Quel est le prix de base approximatif d'un Raspberry Pi ?",opts:["100€","75€","50€","35€"],ans:"d"},
{q:9,ch:1,txt:"Quel modele ultra-compact coute environ 5€ ?",opts:["Pi Pico","Pi Zero","Pi Nano","Pi Mini"],ans:"b"},
{q:10,ch:1,txt:"Quel modele est un microcontroleur avec puce RP2040 ?",opts:["Pi Zero","Compute Module","Pi Pico","Pi 400"],ans:"c"},
{q:11,ch:1,txt:"Pour quelles applications utilise-t-on le Compute Module ?",opts:["Applications industrielles","Jeux video uniquement","Apprentissage scolaire","Media center"],ans:"a"},
{q:12,ch:1,txt:"Lequel n'est PAS un domaine d'application du Pi ?",opts:["Domotique & IoT","Serveurs & NAS","Multimedia","Calcul haute performance HPC"],ans:"d"},
{q:13,ch:1,txt:"Quelle est la frequence du processeur du Raspberry Pi 5 ?",opts:["1.5 GHz","2.4 GHz","1.8 GHz","3.0 GHz"],ans:"b"},
{q:14,ch:1,txt:"Quel processeur utilise le Raspberry Pi 5 ?",opts:["ARM Cortex-A53","ARM Cortex-A72","ARM Cortex-A76","ARM Cortex-M4"],ans:"c"},
{q:15,ch:1,txt:"En quelle annee a ete lance le Raspberry Pi 5 ?",opts:["2023","2022","2024","2021"],ans:"a"},
// Chapter 2: Architecture (18 questions)
{q:16,ch:2,txt:"Quel est le SoC du Raspberry Pi 4 ?",opts:["BCM2835","BCM2837","BCM2711","BCM2712"],ans:"c"},
{q:17,ch:2,txt:"Quel type de processeur equipe le Raspberry Pi 4 ?",opts:["ARM Cortex-A53 32-bit","ARM Cortex-A72 64-bit","Intel Core i3","AMD Ryzen 3"],ans:"b"},
{q:18,ch:2,txt:"Combien de coeurs possede le CPU du Pi 4 ?",opts:["1","2","8","4"],ans:"d"},
{q:19,ch:2,txt:"Quelle est la frequence du CPU du Raspberry Pi 4 ?",opts:["1.5 GHz","1.4 GHz","2.0 GHz","900 MHz"],ans:"a"},
{q:20,ch:2,txt:"Comment s'appelle le GPU du Raspberry Pi 4 ?",opts:["VideoCore IV","Mali-400","VideoCore VI","Adreno 530"],ans:"c"},
{q:21,ch:2,txt:"Quelles capacites de RAM sont disponibles pour le Pi 4 ?",opts:["1, 2, 4 Go","2, 4, 8 Go","512 Mo, 1, 2 Go","4, 8, 16 Go"],ans:"b"},
{q:22,ch:2,txt:"Quel connecteur est utilise pour l'alimentation du Pi 4 ?",opts:["USB Type-C","Micro USB","USB Type-A","Jack barrel DC"],ans:"a"},
{q:23,ch:2,txt:"Quelle alimentation est recommandee pour le Pi 4 ?",opts:["5V / 1A","5V / 2A","12V / 2A","5V / 3A"],ans:"d"},
{q:24,ch:2,txt:"Combien de ports USB 3.0 possede le Raspberry Pi 4 ?",opts:["0","4","2","1"],ans:"c"},
{q:25,ch:2,txt:"Combien de ports USB 2.0 possede le Raspberry Pi 4 ?",opts:["4","2","0","1"],ans:"b"},
{q:26,ch:2,txt:"Combien de sorties micro-HDMI possede le Pi 4 ?",opts:["0","1","2","3"],ans:"c"},
{q:27,ch:2,txt:"Quelle resolution video maximale supporte le Pi 4 ?",opts:["4K @ 60Hz","1080p @ 60Hz","4K @ 30Hz","720p @ 60Hz"],ans:"a"},
{q:28,ch:2,txt:"Quelle est la vitesse du port Ethernet du Pi 4 ?",opts:["10 Mbps","100 Mbps","300 Mbps","1000 Mbps (1 Gbps)"],ans:"d"},
{q:29,ch:2,txt:"Quelle norme WiFi supporte le Raspberry Pi 4 ?",opts:["802.11n uniquement","802.11ac dual-band","802.11ax (WiFi 6)","802.11g uniquement"],ans:"b"},
{q:30,ch:2,txt:"Quelle version de Bluetooth integre le Pi 4 ?",opts:["Bluetooth 5.0","Bluetooth 4.2","Bluetooth 4.0","Bluetooth 3.0"],ans:"a"},
{q:31,ch:2,txt:"Combien de broches possede le connecteur GPIO ?",opts:["26","40","20","50"],ans:"b"},
{q:32,ch:2,txt:"Combien de broches GPIO programmables sont disponibles ?",opts:["40","17","26","8"],ans:"c"},
{q:33,ch:2,txt:"Quelle tension utilisent les GPIO du Raspberry Pi ?",opts:["5V","12V","1.8V","3.3V"],ans:"d"},
// Chapter 3: Installation (12 questions)
{q:34,ch:3,txt:"Quel type de carte memoire utilise le Pi 4 ?",opts:["Carte SD standard","Carte microSD","Carte CompactFlash","Memoire eMMC"],ans:"b"},
{q:35,ch:3,txt:"Quelle capacite minimale de microSD est recommandee ?",opts:["4 Go","8 Go","16 Go","32 Go"],ans:"c"},
{q:36,ch:3,txt:"Quel logiciel officiel flashe Raspberry Pi OS ?",opts:["Raspberry Pi Imager","Raspberry Pi Writer","Pi Flasher","NOOBS"],ans:"a"},
{q:37,ch:3,txt:"Quelle version de Raspberry Pi OS est recommandee ?",opts:["32-bit","Lite","Full","64-bit (recommande)"],ans:"d"},
{q:38,ch:3,txt:"Quelle version n'inclut pas d'interface graphique ?",opts:["Desktop","Lite","Full","Server"],ans:"b"},
{q:39,ch:3,txt:"Quel raccourci ouvre les options avancees dans Imager ?",opts:["Ctrl+Alt+X","Ctrl+O","Ctrl+Shift+X","Alt+F4"],ans:"c"},
{q:40,ch:3,txt:"Que peut-on configurer dans les options avancees ?",opts:["Hostname, SSH, WiFi, utilisateur","Uniquement le nom d'utilisateur","La taille de la partition","La frequence CPU"],ans:"a"},
{q:41,ch:3,txt:"Qu'est-ce que le mode 'headless' ?",opts:["Mode sans processeur","Mode de securite","Mode graphique avance","Utilisation sans ecran ni clavier"],ans:"d"},
{q:42,ch:3,txt:"Quelle classe de microSD est recommandee ?",opts:["Classe 4","Classe 10 / UHS-I","Classe 2","N'importe quelle classe"],ans:"b"},
{q:43,ch:3,txt:"Comment activer SSH avant le premier demarrage ?",opts:["Creer un fichier 'ssh' dans boot","Modifier config.txt","Installer un driver SSH","C'est impossible"],ans:"a"},
{q:44,ch:3,txt:"Combien de temps prend le flashage de l'OS ?",opts:["1-2 minutes","30-60 minutes","5-10 minutes","Plus d'une heure"],ans:"c"},
{q:45,ch:3,txt:"Quel cable video faut-il pour le Pi 4 ?",opts:["HDMI standard","Mini-HDMI","VGA","Micro-HDMI vers HDMI"],ans:"d"},
// Chapter 4: Linux Commands (22 questions)
{q:46,ch:4,txt:"Quelle commande affiche le repertoire courant ?",opts:["cd","pwd","ls","dir"],ans:"b"},
{q:47,ch:4,txt:"Quelle commande permet de changer de repertoire ?",opts:["mv","chdir","cd","goto"],ans:"c"},
{q:48,ch:4,txt:"Quelle commande liste le contenu d'un repertoire ?",opts:["ls","list","show","view"],ans:"a"},
{q:49,ch:4,txt:"Que signifie l'option -la dans ls -la ?",opts:["Liste alphabetique","Liste des liens","Liste des archives","Liste detaillee + fichiers caches"],ans:"d"},

const chapterNames = {1:"Introduction",2:"Architecture",3:"Installation",4:"Commandes Linux",5:"Acces Distance",6:"GPIO",7:"Serveurs"};
const chapterIcons = {1:"🍓",2:"🔧",3:"💿",4:"🐧",5:"🌐",6:"⚡",7:"🖥️"};
const userAnswers = {};

function init() {
    const container = document.getElementById('questionsContainer');
    let currentChapter = 0;
    let html = '';
    
    questions.forEach(q => {
        if (q.ch !== currentChapter) {
            currentChapter = q.ch;
            const count = questions.filter(x => x.ch === currentChapter).length;
            html += `<div class="section-header ch${currentChapter}">
                <div class="section-icon">${chapterIcons[currentChapter]}</div>
                <div class="section-info">
                    <h2>Chapitre ${currentChapter} : ${chapterNames[currentChapter]}</h2>
                    <p>${count} questions</p>
                </div>
            </div>`;
        }
        
        const letters = ['a','b','c','d'];
        let optsHtml = q.opts.map((o,i) => {
            const isCode = o.includes('sudo') || o.includes('apt') || o.includes('ssh') || o.includes('GPIO') || o.includes('cd') || o.includes('ls') || o.includes('mkdir') || o.includes('rm') || o.includes('cp') || o.includes('mv') || o.includes('cat') || o.includes('chmod') || o.includes('grep') || o.includes('ps') || o.includes('hostname') || o.includes('@app') || o.includes('pip');
            const text = isCode ? `<code>${o}</code>` : o;
            return `<div class="opt" data-value="${letters[i]}"><span class="marker">${letters[i].toUpperCase()}</span><span class="otxt">${text}</span></div>`;
        }).join('');
        
        const txtIsCode = q.txt.includes('`');
        const qtext = q.txt.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        html += `<div class="qcard ch${q.ch}" data-q="${q.q}" data-ans="${q.ans}">
            <div class="qheader">
                <div class="qnum">Q${q.q}</div>
                <div class="qtext">${qtext}</div>
            </div>
            <div class="opts">${optsHtml}</div>
        </div>`;
    });
    
    container.innerHTML = html;
    
    document.querySelectorAll('.opt').forEach(opt => {
        opt.addEventListener('click', function() {
            const card = this.closest('.qcard');
            const qNum = card.dataset.q;
            card.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            userAnswers[qNum] = this.dataset.value;
            card.classList.add('answered');
            updateProgress();
        });
    });
}

function updateProgress() {
    const answered = Object.keys(userAnswers).length;
    const pct = (answered / 100) * 100;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressValue').textContent = answered + '/100';
    document.getElementById('progressPercent').textContent = Math.round(pct) + '%';
    if (answered === 100) document.getElementById('submitWarning').style.display = 'none';
}

function submitQuiz() {
    const answered = Object.keys(userAnswers).length;
    if (answered < 100) {
        document.getElementById('submitWarning').style.display = 'block';
        const unanswered = document.querySelector('.qcard:not(.answered)');
        if (unanswered) unanswered.scrollIntoView({behavior:'smooth',block:'center'});
        return;
    }
    
    let correct = 0;
    questions.forEach(q => {
        if (userAnswers[q.q] === q.ans) correct++;
    });
    
    const pct = Math.round((correct/100)*100);
    document.getElementById('correctCount').textContent = correct;
    document.getElementById('incorrectCount').textContent = 100 - correct;
    document.getElementById('scorePct').textContent = pct + '%';
    document.getElementById('scoreCircle').style.background = `conic-gradient(var(--primary) ${pct*3.6}deg, var(--border) ${pct*3.6}deg)`;
    
    const app = document.getElementById('appreciation');
    const appTitle = document.getElementById('appTitle');
    const appText = document.getElementById('appText');
    app.className = 'appreciation';
    
    if (pct >= 90) { app.classList.add('excellent'); appTitle.textContent = '🏆 Excellent !'; appText.textContent = 'Felicitations ! Vous maitrisez parfaitement le Raspberry Pi !'; }
    else if (pct >= 75) { app.classList.add('good'); appTitle.textContent = '👍 Tres Bien !'; appText.textContent = 'Bon travail ! Solides connaissances sur le Raspberry Pi.'; }
    else if (pct >= 50) { app.classList.add('average'); appTitle.textContent = '📚 Peut mieux faire'; appText.textContent = 'Resultat moyen. Revisez les chapitres faibles.'; }
    else { app.classList.add('poor'); appTitle.textContent = '⚠️ A revoir'; appText.textContent = 'Score insuffisant. Etudiez le cours et refaites le QCM.'; }
    
    const ansContainer = document.getElementById('answersContainer');
    ansContainer.innerHTML = '';
    
    questions.forEach(q => {
        const isCorrect = userAnswers[q.q] === q.ans;
        const userAns = userAnswers[q.q] ? userAnswers[q.q].toUpperCase() : '-';
        const correctAns = q.ans.toUpperCase();
        const shortTxt = q.txt.length > 70 ? q.txt.substring(0,70) + '...' : q.txt;
        
        ansContainer.innerHTML += `<div class="ans-card ${isCorrect?'correct':'incorrect'}" data-status="${isCorrect?'correct':'incorrect'}">
            <div class="ans-status ${isCorrect?'correct':'incorrect'}">${isCorrect?'✓':'✗'}</div>
            <div class="ans-content">
                <div class="ans-q"><strong>Q${q.q}:</strong> ${shortTxt}</div>
                <div class="ans-info">
                    <span class="your-ans">Votre reponse: <strong>${userAns}</strong></span>
                    ${!isCorrect ? `<span class="correct-ans">Correcte: <strong>${correctAns}</strong></span>` : ''}
                </div>
            </div>
        </div>`;
    });
    
    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({behavior:'smooth'});
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = '✅ QCM Termine';
}

function filterAnswers(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.ans-card').forEach(card => {
        if (filter === 'all') card.classList.remove('hidden');
        else card.classList.toggle('hidden', card.dataset.status !== filter);
    });
}

init();
</script>
